version: 1
project:
  root: .
  stacks: [python, static-web, github-pages]
  package_managers: [pip]
  monorepo: false
  signals: [pyproject.toml, unittest, github-actions]
sdd:
  artifact_store: 02-DOCS/wiki/sdd
  execution_mode: automatic
  registry_path: .rsc/skill-registry.json
  review_budget:
    line_budget: 400
    file_budget: 12
  delivery_strategy:
    default: ask-on-risk
testing:
  strict_tdd: true
  runners: [unittest]
  commands:
    apply:
      - "$env:PYTHONPATH = 'src'; python -m unittest discover -s tests"
      - "$env:PYTHONPATH = 'src'; python -m porra_champions.build_data --out public/datos.json"
    verify:
      - "$env:PYTHONPATH = 'src'; python -m unittest discover -s tests"
      - "$env:PYTHONPATH = 'src'; python -m porra_champions.build_data --out public/datos.json"
phase_rules:
  proposal: optional-on-ambiguity
  specify: requires intent or proposal
  plan: requires spec
  tasks: requires plan and spec
  analyze: requires spec plan tasks
  implement: requires analyze pass, strict_tdd when testing.strict_tdd is true
  verify: requires spec tasks evidence
  archive: requires verify record and review/ship outcome
models:
  enabled: false
  provider: openai
  tiers:
    heavy: gpt-5.6-sol
    balanced: gpt-5.6-terra
    light: gpt-5.6-terra
  phases:
    constitution: heavy
    specify: balanced
    clarify: balanced
    plan: heavy
    tasks: balanced
    analyze: heavy
    implement: balanced
    verify: balanced
    review: heavy
    ship: light
    debug: heavy
    worktrees: light
    sdd-init: light
  overrides: {}
