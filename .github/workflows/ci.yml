name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install package
        run: python -m pip install -e .

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run JavaScript tests
        run: node --test tests/auth.test.cjs

      - name: Build deterministic public data
        env:
          BUILD_DATE: "2026-09-07"
          PREVIOUS_DATOS_URL: ""
          PYTHONPATH: src
        run: python -m porra_champions.build_data --out public/datos.json

      - name: Validate generated JSON
        run: python -m json.tool public/datos.json > /dev/null
