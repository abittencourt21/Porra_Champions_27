name: Build, sync and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions: {}

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: |
          python -m unittest discover -s tests
          node --test tests/auth.test.cjs

      - name: Build public data
        env:
          PYTHONPATH: src
        run: python -m porra_champions.build_data --out public/datos.json

      - name: Configure public Supabase client
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY GitHub secret."
            exit 1
          fi
          node -e 'const fs=require("fs"); fs.writeFileSync("public/supabase-config.js", `window.PORRA_SUPABASE = ${JSON.stringify({url:process.env.SUPABASE_URL,publishableKey:process.env.SUPABASE_PUBLISHABLE_KEY}, null, 2)};\n`);'

      - name: Upload site build
        uses: actions/upload-artifact@v6
        with:
          name: pages-site
          path: public
          if-no-files-found: error
          retention-days: 1

      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory public -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  sync-supabase:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Download site build
        uses: actions/download-artifact@v7
        with:
          name: pages-site
          path: public

      - name: Sync teams, players and matches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m porra_champions.sync_supabase

  deploy:
    needs: [build, sync-supabase]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
